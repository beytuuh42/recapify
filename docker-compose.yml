services:
  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_URL: ${FRONTEND_API_URL:-/}
        SENTRY_DSN: ${SENTRY_DSN:-}
        SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    container_name: recapify-frontend-prod
    depends_on:
      backend-prod:
        condition: service_healthy
    ports:
      - ${FRONTEND_PROD_PORT:-4200}:8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  backend-prod:
    profiles: ["prod"]
    build:
      context: ./backend/recapify
      dockerfile: Dockerfile
    container_name: recapify-backend-prod
    depends_on:
      ml-prod:
        condition: service_healthy
    environment:
      - LLM_SERVICE_BASEURL=http://ml-prod:8000
      - CORS_ALLOWED_ORIGIN_PATTERNS=${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*}
    expose:
      - 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  ml-prod:
    profiles: ["prod"]
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: recapify-ml-prod
    env_file:
      - path: ./ml/.env.prod
        required: false
    expose:
      - 8000
    volumes:
      - ml-cache:/app/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: recapify-frontend-dev
    depends_on:
      - backend-dev
      - ml-dev
    ports:
      - 4200:4200
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./frontend/package.json
    restart: unless-stopped

  backend-dev:
    profiles: ["dev"]
    build:
      context: ./backend/recapify
      dockerfile: Dockerfile.dev
    container_name: recapify-backend-dev
    environment:
      - LLM_SERVICE_BASEURL=http://ml-dev:8000
    ports:
      - 8081:8080
      - 35729:35729
    develop:
      watch:
        - action: sync
          path: ./backend/recapify/src
          target: /app/src
        - action: rebuild
          path: ./backend/recapify/pom.xml
    restart: unless-stopped

  ml-dev:
    profiles: ["dev"]
    build:
      context: ./ml
      dockerfile: Dockerfile.dev
    container_name: recapify-ml-dev
    ports:
      - 8000:8000
    env_file:
      - ./ml/.env
    develop:
      watch:
        - action: sync
          path: ./ml/app
          target: /app/app
        - action: rebuild
          path: ./ml/requirements.txt
    restart: unless-stopped

volumes:
  ml-cache:
