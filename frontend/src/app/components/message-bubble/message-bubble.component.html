<div class="message" [class.message--assistant]="role === Role.assistant" [class.message--user]="role === Role.user">
  @if (role === Role.assistant) {
  <div class="message__avatar">{{ avatar }}</div>
  }
  <div class="message__bubble">
    @if (summary) {
    <app-episode-summary [summary]="summary" (animationComplete)="animationComplete.emit()" />
    } @else {
    <p>{{ text }}</p>
    }
  </div>
  @if (role === Role.user) {
  <div class="message__avatar">{{ avatar }}</div>
  }
</div>
