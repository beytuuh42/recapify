<header class="chat-topbar">
  <div class="brand">
    <span class="brand__eyebrow">Recapify</span>
    <div class="brand__copy">
      <strong>Skip the subtitle hunt.</strong>
      <span>Drop a title, season, episode, and language. Get the beats that mattered.</span>
    </div>
    <div class="brand__tags">
      <span>TV</span>
      <span>Anime</span>
      <span>Films</span>
    </div>
  </div>
  <button (click)="clear()" class="btn btn--secondary">New conversation</button>
</header>
