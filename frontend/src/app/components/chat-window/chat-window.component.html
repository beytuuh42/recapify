<section class="chat-window">

  @for (message of messages(); track message.id) {
  <app-message-bubble [role]="message.role" [avatar]="message.avatar" [text]="message.content" [summary]="message.summary" (animationComplete)="chatService.setBusy(false)" />
  }

  @if (isBusy()) {
  <app-typing-indicator />
  }

</section>
